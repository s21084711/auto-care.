<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AutoCare — 정비 이력</title>
<link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@300;400;500;600;700&family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #080c14;
    --surface: #0d1421;
    --surface2: #111927;
    --border: rgba(100,180,255,0.12);
    --accent: #4db8ff;
    --accent2: #00ffd5;
    --accent3: #ff6b4a;
    --text: #e8f4ff;
    --text-dim: #7a9ab8;
    --glow: rgba(77,184,255,0.3);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Pretendard', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* ─── SHARED HEADER ─── */
  .header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 18px 40px;
    border-bottom: 1px solid var(--border);
    background: rgba(8,12,20,0.9);
    backdrop-filter: blur(20px);
    position: sticky; top: 0; z-index: 100;
  }
  .logo {
    font-family: 'Orbitron', monospace;
    font-size: 20px; font-weight: 900;
    letter-spacing: 3px;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  }
  .mode-badge {
    font-size: 11px; font-weight: 600; letter-spacing: 2px; text-transform: uppercase;
    padding: 5px 14px; border-radius: 20px;
    border: 1px solid var(--accent);
    color: var(--accent);
  }

  /* ─── ADMIN PAGE ─── */
  #admin-page { display: none; }
  .admin-wrap { max-width: 820px; margin: 0 auto; padding: 40px 24px 80px; }

  .admin-title {
    font-family: 'Orbitron', monospace;
    font-size: 28px; font-weight: 700; margin-bottom: 6px;
    color: var(--text);
  }
  .admin-sub { color: var(--text-dim); font-size: 14px; margin-bottom: 36px; }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 28px;
    margin-bottom: 20px;
  }
  .card-title {
    font-size: 13px; font-weight: 600; letter-spacing: 2px; text-transform: uppercase;
    color: var(--accent); margin-bottom: 20px;
  }

  .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 16px; }
  .form-group { display: flex; flex-direction: column; gap: 7px; }
  .form-group.full { grid-column: 1 / -1; }

  label { font-size: 12px; color: var(--text-dim); font-weight: 500; letter-spacing: 0.5px; }

  input, select, textarea {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 10px;
    color: var(--text);
    font-family: 'Pretendard', sans-serif;
    font-size: 14px;
    padding: 11px 14px;
    outline: none;
    transition: border-color 0.2s, box-shadow 0.2s;
  }
  input:focus, select:focus, textarea:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(77,184,255,0.1);
  }
  textarea { resize: vertical; min-height: 90px; }

  select option { background: #0d1421; }

  /* Part selector */
  .part-grid {
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px;
    margin-bottom: 16px;
  }
  .part-btn {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 10px;
    color: var(--text-dim);
    font-family: 'Pretendard', sans-serif;
    font-size: 13px;
    padding: 10px 8px;
    cursor: pointer;
    transition: all 0.2s;
    text-align: center;
  }
  .part-btn:hover { border-color: var(--accent); color: var(--accent); }
  .part-btn.selected {
    background: rgba(77,184,255,0.15);
    border-color: var(--accent);
    color: var(--accent);
    box-shadow: 0 0 12px rgba(77,184,255,0.2);
  }

  /* Items */
  .item-list { display: flex; flex-direction: column; gap: 12px; }
  .item-entry {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 16px;
    position: relative;
  }
  .item-entry .remove-btn {
    position: absolute; top: 12px; right: 12px;
    background: rgba(255,107,74,0.15); border: 1px solid rgba(255,107,74,0.3);
    color: var(--accent3); border-radius: 6px; padding: 3px 10px; cursor: pointer;
    font-size: 12px; font-family: 'Pretendard', sans-serif;
  }
  .item-entry .remove-btn:hover { background: rgba(255,107,74,0.3); }

  .add-item-btn {
    display: flex; align-items: center; justify-content: center; gap: 8px;
    width: 100%; padding: 12px;
    background: transparent; border: 1px dashed rgba(77,184,255,0.3);
    border-radius: 10px; color: var(--accent); cursor: pointer; font-size: 14px;
    font-family: 'Pretendard', sans-serif; margin-top: 12px; transition: all 0.2s;
  }
  .add-item-btn:hover { background: rgba(77,184,255,0.07); border-color: var(--accent); }

  /* Photo upload */
  .photo-upload-area {
    border: 2px dashed rgba(77,184,255,0.25);
    border-radius: 12px; padding: 24px; text-align: center; cursor: pointer;
    transition: all 0.2s; position: relative;
  }
  .photo-upload-area:hover { border-color: var(--accent); background: rgba(77,184,255,0.04); }
  .photo-upload-area input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
  .upload-icon { font-size: 32px; margin-bottom: 8px; }
  .upload-text { font-size: 13px; color: var(--text-dim); }

  .photo-preview { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 14px; }
  .photo-thumb-wrap {
    position: relative; width: 80px; height: 80px;
  }
  .photo-thumb-wrap:hover .photo-delete-btn { opacity: 1; }
  .photo-thumb {
    width: 80px; height: 80px; border-radius: 8px; object-fit: cover;
    border: 1px solid var(--border); display: block;
    transition: filter 0.2s;
  }
  .photo-thumb-wrap:hover .photo-thumb { filter: brightness(0.55); }
  .photo-delete-btn {
    position: absolute; top: 4px; right: 4px;
    width: 22px; height: 22px; border-radius: 50%;
    background: var(--accent3); border: none;
    color: #fff; font-size: 11px; font-weight: 700;
    cursor: pointer; opacity: 0; transition: opacity 0.2s;
    display: flex; align-items: center; justify-content: center;
    line-height: 1; padding: 0;
    box-shadow: 0 2px 6px rgba(0,0,0,0.4);
  }
  .photo-delete-btn:hover { background: #ff3a1a; }

  /* Generate link */
  .generate-btn {
    width: 100%; padding: 16px;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    border: none; border-radius: 12px;
    color: #080c14; font-family: 'Orbitron', monospace;
    font-size: 14px; font-weight: 700; letter-spacing: 2px;
    cursor: pointer; margin-top: 8px;
    transition: opacity 0.2s, transform 0.1s;
  }
  .generate-btn:hover { opacity: 0.9; transform: translateY(-1px); }
  .generate-btn:active { transform: translateY(0); }

  .link-result {
    display: none; margin-top: 16px;
    background: rgba(0,255,213,0.07); border: 1px solid rgba(0,255,213,0.25);
    border-radius: 12px; padding: 16px;
  }
  .link-result.show { display: block; }
  .link-label { font-size: 11px; color: var(--accent2); letter-spacing: 1px; margin-bottom: 8px; }
  .link-url {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 8px; padding: 10px 14px;
    font-size: 13px; color: var(--text);
    word-break: break-all; margin-bottom: 10px;
  }
  .copy-btn {
    background: var(--accent2); color: #080c14;
    border: none; border-radius: 8px; padding: 8px 18px;
    font-family: 'Pretendard', sans-serif; font-weight: 600; font-size: 13px;
    cursor: pointer;
  }

  /* ─── CUSTOMER PAGE ─── */
  #customer-page { display: none; }

  .customer-header-info {
    max-width: 1100px; margin: 0 auto; padding: 30px 24px 0;
    display: flex; align-items: flex-start; justify-content: space-between; flex-wrap: wrap; gap: 16px;
  }
  .car-info-block h1 {
    font-family: 'Orbitron', monospace; font-size: 26px; font-weight: 700;
  }
  .car-info-block .plate {
    display: inline-block; margin-top: 6px;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    font-size: 22px; font-weight: 700;
  }
  .car-info-block .date { color: var(--text-dim); font-size: 13px; margin-top: 4px; }

  .summary-pills { display: flex; gap: 10px; flex-wrap: wrap; align-items: flex-start; margin-top: 8px; }
  .pill {
    background: rgba(77,184,255,0.1); border: 1px solid rgba(77,184,255,0.25);
    border-radius: 20px; padding: 5px 14px; font-size: 12px; color: var(--accent);
  }

  /* Car viewer */
  .car-viewer {
    max-width: 1100px; margin: 0 auto; padding: 20px 24px 60px;
    position: relative;
  }

  .car-stage {
    position: relative; width: 100%; min-height: 500px;
    display: flex; align-items: center; justify-content: center;
  }

  /* SVG car */
  .car-svg-wrap {
    position: relative; width: 700px; max-width: 100%;
    filter: drop-shadow(0 0 40px rgba(77,184,255,0.12));
  }
  .car-svg-wrap svg { width: 100%; height: auto; }

  /* Highlighted parts */
  .car-part { transition: all 0.3s; }
  .car-part.highlighted {
    filter: drop-shadow(0 0 10px var(--accent));
  }
  .car-part.highlighted path, .car-part.highlighted ellipse,
  .car-part.highlighted rect, .car-part.highlighted circle {
    fill-opacity: 0.85 !important;
  }

  /* Bubbles */
  .bubble-container {
    position: absolute; inset: 0; pointer-events: none;
  }
  .repair-bubble {
    position: absolute; pointer-events: all; cursor: pointer;
    transform: translate(-50%, -100%);
    z-index: 50;
  }
  .bubble-dot {
    width: 14px; height: 14px; border-radius: 50%;
    background: var(--accent); box-shadow: 0 0 0 4px rgba(77,184,255,0.25), 0 0 16px rgba(77,184,255,0.5);
    margin: 0 auto;
    animation: pulse 2s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { box-shadow: 0 0 0 4px rgba(77,184,255,0.25), 0 0 16px rgba(77,184,255,0.5); }
    50% { box-shadow: 0 0 0 8px rgba(77,184,255,0.1), 0 0 24px rgba(77,184,255,0.7); }
  }
  .bubble-card {
    background: var(--surface);
    border: 1px solid var(--accent);
    border-radius: 14px; padding: 12px 14px;
    margin-bottom: 6px; min-width: 160px; max-width: 200px;
    box-shadow: 0 4px 24px rgba(0,0,0,0.5), 0 0 20px rgba(77,184,255,0.1);
    transition: transform 0.2s, box-shadow 0.2s;
  }
  .repair-bubble:hover .bubble-card {
    transform: translateY(-3px);
    box-shadow: 0 8px 32px rgba(0,0,0,0.6), 0 0 28px rgba(77,184,255,0.2);
  }
  .bubble-part-name {
    font-size: 10px; color: var(--accent); letter-spacing: 1px; text-transform: uppercase; font-weight: 600;
  }
  .bubble-item-name {
    font-size: 14px; font-weight: 600; margin: 3px 0;
  }
  .bubble-thumb {
    width: 100%; height: 70px; object-fit: cover; border-radius: 8px;
    margin-top: 8px; border: 1px solid var(--border);
  }
  .bubble-thumb-placeholder {
    width: 100%; height: 50px; border-radius: 8px; margin-top: 6px;
    background: var(--surface2); border: 1px solid var(--border);
    display: flex; align-items: center; justify-content: center;
    font-size: 10px; color: var(--text-dim);
  }
  .bubble-tap { font-size: 10px; color: var(--text-dim); margin-top: 5px; }

  /* Connector line */
  .bubble-line {
    width: 2px; height: 30px; background: linear-gradient(to bottom, var(--accent), transparent);
    margin: 0 auto;
  }

  /* Detail Modal */
  .modal-overlay {
    display: none; position: fixed; inset: 0; z-index: 200;
    background: rgba(4,8,16,0.85); backdrop-filter: blur(10px);
    align-items: center; justify-content: center; padding: 20px;
  }
  .modal-overlay.open { display: flex; }
  .modal {
    background: var(--surface); border: 1px solid var(--accent);
    border-radius: 20px; padding: 32px; max-width: 560px; width: 100%;
    max-height: 90vh; overflow-y: auto;
    box-shadow: 0 0 60px rgba(77,184,255,0.2);
    animation: modalIn 0.25s ease;
  }
  @keyframes modalIn {
    from { opacity: 0; transform: scale(0.95) translateY(10px); }
    to { opacity: 1; transform: none; }
  }
  .modal-close {
    float: right; background: var(--surface2); border: 1px solid var(--border);
    color: var(--text-dim); border-radius: 8px; padding: 4px 12px; cursor: pointer;
    font-family: 'Pretendard', sans-serif; font-size: 13px; margin-bottom: 16px;
  }
  .modal-part-tag {
    display: inline-block; background: rgba(77,184,255,0.1); border: 1px solid rgba(77,184,255,0.3);
    border-radius: 20px; padding: 4px 12px; font-size: 11px; color: var(--accent);
    letter-spacing: 1px; text-transform: uppercase; margin-bottom: 10px;
  }
  .modal-title { font-size: 22px; font-weight: 700; margin-bottom: 6px; }
  .modal-type { font-size: 13px; color: var(--text-dim); margin-bottom: 16px; }

  .modal-photos { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 20px; }
  .modal-photo { width: 100%; border-radius: 12px; object-fit: cover; max-height: 220px; border: 1px solid var(--border); }

  .modal-section { margin-bottom: 16px; }
  .modal-section-label { font-size: 11px; color: var(--accent2); letter-spacing: 1.5px; text-transform: uppercase; margin-bottom: 6px; }
  .modal-section-content { font-size: 14px; line-height: 1.7; color: var(--text); }

  .modal-comment {
    background: var(--surface2); border-left: 3px solid var(--accent2);
    border-radius: 0 10px 10px 0; padding: 14px 16px;
    font-size: 14px; line-height: 1.7; color: var(--text);
  }

  /* ─── EMPTY/LOADING ─── */
  .empty-state { text-align: center; padding: 80px 20px; color: var(--text-dim); }
  .empty-icon { font-size: 48px; margin-bottom: 16px; }

  /* Mobile responsive */
  @media (max-width: 600px) {
    .header { padding: 14px 20px; }
    .form-row { grid-template-columns: 1fr; }
    .part-grid { grid-template-columns: repeat(2, 1fr); }
    .car-svg-wrap { width: 100%; }
    .admin-wrap { padding: 20px 16px 60px; }
    .customer-header-info { padding: 20px 16px 0; }
    .car-viewer { padding: 16px 16px 40px; }
  }

  /* Canvas for car glow */
  .car-canvas-overlay {
    position: absolute; inset: 0; pointer-events: none;
  }
</style>
</head>
<body>

<!-- ═══════════════════════════════════
     ADMIN PAGE
══════════════════════════════════════ -->
<div id="admin-page">
  <header class="header">
    <div class="logo">AUTOCARE</div>
    <div class="mode-badge">정비 입력</div>
  </header>
  <div class="admin-wrap">
    <div class="admin-title">정비 이력 입력</div>
    <div class="admin-sub">정비 완료 후 아래 정보를 입력하고 고객 링크를 생성하세요.</div>

    <!-- 차량 정보 -->
    <div class="card">
      <div class="card-title">🚗 차량 정보</div>
      <div class="form-row">
        <div class="form-group">
          <label>차량 번호판</label>
          <input type="text" id="car-plate" placeholder="예: 123가 4567">
        </div>
        <div class="form-group">
          <label>차종</label>
          <input type="text" id="car-model" placeholder="예: 현대 아반떼 2022">
        </div>
        <div class="form-group">
          <label>고객 이름</label>
          <input type="text" id="customer-name" placeholder="예: 홍길동">
        </div>
        <div class="form-group">
          <label>정비 날짜</label>
          <input type="date" id="repair-date">
        </div>
      </div>
    </div>

    <!-- 정비 항목 -->
    <div class="card">
      <div class="card-title">🔧 정비 항목</div>
      <div class="item-list" id="item-list"></div>
      <button class="add-item-btn" onclick="addItem()">+ 항목 추가</button>
    </div>

    <!-- 링크 생성 -->
    <div class="card">
      <div class="card-title">🔗 고객 링크 생성</div>
      <button class="generate-btn" onclick="generateLink()">고객 공유 링크 생성</button>
      <div class="link-result" id="link-result">
        <div id="link-loading" style="display:none; text-align:center; padding:12px 0; color:var(--accent); font-size:13px;">
          🔗 단축 링크 생성 중...
        </div>
        <div id="link-short-wrap" style="display:none;">
          <div class="link-label">✅ 단축 링크 (고객에게 전달하세요)</div>
          <div class="link-url" id="link-short" style="font-size:18px; font-weight:600; color:var(--accent2); letter-spacing:0.5px;"></div>
          <button class="copy-btn" onclick="copyShortLink()">링크 복사</button>
        </div>
        <div id="link-fallback-wrap" style="display:none; margin-top:12px;">
          <div class="link-label" style="color:var(--text-dim);">단축 실패 시 원본 링크</div>
          <div class="link-url" id="link-url" style="font-size:11px; color:var(--text-dim); word-break:break-all;"></div>
          <button class="copy-btn" style="background:var(--accent); margin-top:8px;" onclick="copyLink()">원본 링크 복사</button>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- ═══════════════════════════════════
     CUSTOMER PAGE
══════════════════════════════════════ -->
<div id="customer-page">
  <header class="header">
    <div class="logo">AUTOCARE</div>
    <div class="mode-badge">정비 리포트</div>
  </header>
  <div class="customer-header-info">
    <div class="car-info-block">
      <h1 id="view-model">로딩 중...</h1>
      <div class="plate" id="view-plate"></div>
      <div class="date" id="view-date"></div>
    </div>
    <div>
      <div class="summary-pills" id="summary-pills"></div>
    </div>
  </div>
  <div class="car-viewer">
    <div class="car-stage" id="car-stage">
      <div class="car-svg-wrap" id="car-svg-wrap">
        <!-- CAR SVG (sedan, side + top combined view) -->
        <svg viewBox="0 0 700 340" xmlns="http://www.w3.org/2000/svg" id="car-svg">
          <defs>
            <linearGradient id="bodyGrad" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="#1a2840" stop-opacity="0.6"/>
              <stop offset="100%" stop-color="#0a1520" stop-opacity="0.4"/>
            </linearGradient>
            <linearGradient id="glassGrad" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="#4db8ff" stop-opacity="0.25"/>
              <stop offset="100%" stop-color="#4db8ff" stop-opacity="0.05"/>
            </linearGradient>
            <filter id="glow">
              <feGaussianBlur stdDeviation="3" result="blur"/>
              <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
            </filter>
          </defs>

          <!-- Car body outline -->
          <g id="part-body" class="car-part" data-part="body">
            <!-- Main body -->
            <path d="M100 220 L100 190 L140 160 L200 120 L280 105 L420 105 L500 120 L560 160 L600 190 L600 220 L100 220 Z"
              fill="url(#bodyGrad)" stroke="#4db8ff" stroke-width="1.5" stroke-opacity="0.5"/>
            <!-- Hood -->
            <path d="M420 105 L500 120 L560 160 L580 185 L420 185 Z"
              fill="rgba(77,184,255,0.08)" stroke="#4db8ff" stroke-width="1" stroke-opacity="0.3"
              id="part-hood-path"/>
            <!-- Trunk -->
            <path d="M140 160 L200 120 L200 185 L120 185 Z"
              fill="rgba(77,184,255,0.08)" stroke="#4db8ff" stroke-width="1" stroke-opacity="0.3"
              id="part-trunk-path"/>
            <!-- Roof -->
            <path d="M220 110 L480 110 L480 160 L220 160 Z"
              fill="url(#glassGrad)" stroke="#4db8ff" stroke-width="1.5" stroke-opacity="0.6"/>
            <!-- Windshield -->
            <path d="M200 120 L220 110 L220 160 L140 160 Z"
              fill="url(#glassGrad)" stroke="#4db8ff" stroke-width="1" stroke-opacity="0.5"/>
            <!-- Rear glass -->
            <path d="M480 110 L500 120 L560 160 L480 160 Z"
              fill="url(#glassGrad)" stroke="#4db8ff" stroke-width="1" stroke-opacity="0.5"/>
            <!-- Ground line -->
            <line x1="100" y1="220" x2="600" y2="220" stroke="#4db8ff" stroke-width="0.8" stroke-opacity="0.4"/>
          </g>

          <!-- WHEELS -->
          <g id="part-tires" class="car-part" data-part="tires">
            <!-- Front wheel -->
            <circle cx="490" cy="226" r="38" fill="rgba(10,18,30,0.8)" stroke="#4db8ff" stroke-width="1.5" stroke-opacity="0.6"/>
            <circle cx="490" cy="226" r="26" fill="none" stroke="#4db8ff" stroke-width="1" stroke-opacity="0.4"/>
            <circle cx="490" cy="226" r="12" fill="rgba(77,184,255,0.15)" stroke="#4db8ff" stroke-width="1.5" stroke-opacity="0.6"/>
            <!-- Spoke lines front -->
            <line x1="490" y1="200" x2="490" y2="252" stroke="#4db8ff" stroke-width="1" stroke-opacity="0.3"/>

            <line x1="471" y1="207" x2="509" y2="245" stroke="#4db8ff" stroke-width="1" stroke-opacity="0.2"/>

<!-- ═══════════════════════════════════
     MODAL
══════════════════════════════════════ -->
<div class="modal-overlay" id="modal-overlay" onclick="closeModal(event)">
  <div class="modal" id="modal">
    <button class="modal-close" onclick="closeModalDirect()">✕ 닫기</button>
    <div class="modal-part-tag" id="modal-part"></div>
    <div class="modal-title" id="modal-title"></div>
    <div class="modal-type" id="modal-type"></div>
    <div class="modal-photos" id="modal-photos"></div>
    <div class="modal-section">
      <div class="modal-section-label">정비 내용</div>
      <div class="modal-section-content" id="modal-desc"></div>
    </div>
    <div class="modal-section" id="modal-comment-section">
      <div class="modal-section-label">사장님 코멘트</div>
      <div class="modal-comment" id="modal-comment"></div>
    </div>
  </div>
</div>

<script>
// ══════════════════════════════════════
//  PART CONFIGS (position % of SVG box)
// ══════════════════════════════════════
const PARTS = [
  { id: 'engine',     label: '엔진',      svgId: 'part-engine',     bubbleX: 74, bubbleY: 33 },
  { id: 'tires',      label: '타이어/휠', svgId: 'part-tires',      bubbleX: 50, bubbleY: 82 },
  { id: 'brakes',     label: '브레이크',  svgId: 'part-brakes',     bubbleX: 50, bubbleY: 72 },
  { id: 'lights',     label: '라이트',    svgId: 'part-lights',     bubbleX: 88, bubbleY: 52 },
  { id: 'suspension', label: '서스펜션',  svgId: 'part-suspension', bubbleX: 35, bubbleY: 60 },
  { id: 'oil',        label: '오일/필터', svgId: 'part-oil',        bubbleX: 50, bubbleY: 55 },
  { id: 'battery',    label: '배터리',    svgId: 'part-battery',    bubbleX: 70, bubbleY: 58 },
  { id: 'ac',         label: '에어컨',    svgId: 'part-ac',         bubbleX: 42, bubbleY: 38 },
  { id: 'body',       label: '차체',      svgId: 'part-body',       bubbleX: 20, bubbleY: 60 },
];

const PART_COLORS = {
  engine: '#ff6b4a', tires: '#4db8ff', brakes: '#ffd84d',
  lights: '#4db8ff', suspension: '#b84dff', oil: '#4dff9e',
  battery: '#00ffd5', ac: '#4db8ff', body: '#ff4d8b',
};

const REPAIR_TYPES = ['교체', '점검', '수리', '세척', '충전', '교환', '조정', '기타'];

// ══════════════════════════════════════
//  ADMIN LOGIC
// ══════════════════════════════════════
let items = [];
let itemCounter = 0;

function addItem() {
  const id = ++itemCounter;
  items.push({ id, part: '', name: '', type: '', desc: '', comment: '', photos: [] });

  const el = document.createElement('div');
  el.className = 'item-entry';
  el.id = `item-${id}`;
  el.innerHTML = `
    <button class="remove-btn" onclick="removeItem(${id})">✕ 삭제</button>
    <div class="form-row" style="margin-bottom:12px">
      <div class="form-group">
        <label>부품 / 위치</label>
        <select onchange="updateItem(${id},'part',this.value)">
          <option value="">선택하세요</option>
          ${PARTS.map(p=>`<option value="${p.id}">${p.label}</option>`).join('')}
        </select>
      </div>
      <div class="form-group">
        <label>정비 유형</label>
        <select onchange="updateItem(${id},'type',this.value)">
          <option value="">선택하세요</option>
          ${REPAIR_TYPES.map(t=>`<option value="${t}">${t}</option>`).join('')}
        </select>
      </div>
      <div class="form-group full">
        <label>품목명</label>
        <input type="text" placeholder="예: 엔진오일 5W-30" onchange="updateItem(${id},'name',this.value)">
      </div>
      <div class="form-group full">
        <label>정비 내용</label>
        <textarea placeholder="정비한 내용을 자세히 입력하세요." onchange="updateItem(${id},'desc',this.value)"></textarea>
      </div>
      <div class="form-group full">
        <label>사장님 코멘트</label>
        <textarea placeholder="고객에게 전달할 메시지나 권장 사항을 입력하세요." onchange="updateItem(${id},'comment',this.value)"></textarea>
      </div>
    </div>
    <div class="form-group">
      <label>사진 업로드</label>
      <div class="photo-upload-area">
        <input type="file" accept="image/*" multiple onchange="handlePhotos(${id}, this)">
        <div class="upload-icon">📷</div>
        <div class="upload-text">클릭하여 사진 추가</div>
      </div>
      <div class="photo-preview" id="photos-${id}"></div>
    </div>
  `;
  document.getElementById('item-list').appendChild(el);
}

function removeItem(id) {
  items = items.filter(i => i.id !== id);
  document.getElementById(`item-${id}`).remove();
}

function updateItem(id, key, val) {
  const item = items.find(i => i.id === id);
  if (item) item[key] = val;
}

function handlePhotos(id, input) {
  const item = items.find(i => i.id === id);
  if (!item) return;
  const preview = document.getElementById(`photos-${id}`);
  Array.from(input.files).forEach(file => {
    const reader = new FileReader();
    reader.onload = e => {
      const src = e.target.result;
      const photoIdx = item.photos.length;
      item.photos.push(src);

      const wrap = document.createElement('div');
      wrap.className = 'photo-thumb-wrap';

      const img = document.createElement('img');
      img.src = src;
      img.className = 'photo-thumb';

      const btn = document.createElement('button');
      btn.className = 'photo-delete-btn';
      btn.innerHTML = '✕';
      btn.title = '사진 삭제';
      btn.onclick = () => {
        // Remove from data array by src match
        const idx = item.photos.indexOf(src);
        if (idx !== -1) item.photos.splice(idx, 1);
        wrap.remove();
      };

      wrap.appendChild(img);
      wrap.appendChild(btn);
      preview.appendChild(wrap);
    };
    reader.readAsDataURL(file);
  });
}

async function generateLink() {
  const plate = document.getElementById('car-plate').value.trim();
  const model = document.getElementById('car-model').value.trim();
  const customer = document.getElementById('customer-name').value.trim();
  const date = document.getElementById('repair-date').value;

  if (!plate || !model) { alert('차량 번호판과 차종을 입력하세요.'); return; }
  if (items.length === 0) { alert('정비 항목을 하나 이상 추가하세요.'); return; }
  if (items.some(i => !i.part || !i.name)) { alert('모든 항목의 부품 위치와 품목명을 입력하세요.'); return; }

  const data = { plate, model, customer, date, items };
  const encoded = btoa(encodeURIComponent(JSON.stringify(data)));
  const longUrl = `${location.href.split('?')[0]}?view=${encoded}`;

  // Show loading state
  const resultEl = document.getElementById('link-result');
  resultEl.classList.add('show');
  document.getElementById('link-loading').style.display = 'block';
  document.getElementById('link-short-wrap').style.display = 'none';
  document.getElementById('link-fallback-wrap').style.display = 'none';

  // Store full URL for fallback copy
  document.getElementById('link-url').textContent = longUrl;

  try {
    const res = await fetch(
      `https://tinyurl.com/api-create.php?url=${encodeURIComponent(longUrl)}`
    );
    if (!res.ok) throw new Error('API error');
    const shortUrl = await res.text();

    document.getElementById('link-loading').style.display = 'none';
    document.getElementById('link-short').textContent = shortUrl.trim();
    document.getElementById('link-short-wrap').style.display = 'block';
  } catch (e) {
    // Fallback: show original long link
    document.getElementById('link-loading').style.display = 'none';
    document.getElementById('link-fallback-wrap').style.display = 'block';
  }
}

function copyShortLink() {
  const url = document.getElementById('link-short').textContent;
  navigator.clipboard.writeText(url).then(() => {
    const btn = event.target;
    btn.textContent = '✓ 복사됨!';
    setTimeout(() => btn.textContent = '링크 복사', 2000);
  });
}

function copyLink() {
  const url = document.getElementById('link-url').textContent;
  navigator.clipboard.writeText(url).then(() => {
    const btn = event.target;
    btn.textContent = '✓ 복사됨!';
    setTimeout(() => btn.textContent = '원본 링크 복사', 2000);
  });
}

// ══════════════════════════════════════
//  CUSTOMER VIEW LOGIC
// ══════════════════════════════════════
function loadCustomerView(data) {
  document.getElementById('view-model').textContent = data.model;
  document.getElementById('view-plate').textContent = data.plate;
  document.getElementById('view-date').textContent =
    data.date ? new Date(data.date).toLocaleDateString('ko-KR', { year:'numeric', month:'long', day:'numeric' }) : '';

  // Pills
  const pills = document.getElementById('summary-pills');
  const partSet = [...new Set(data.items.map(i => i.part))];
  partSet.forEach(p => {
    const info = PARTS.find(x => x.id === p);
    if (!info) return;
    const div = document.createElement('div');
    div.className = 'pill';
    div.textContent = info.label;
    pills.appendChild(div);
  });

  // Highlight parts on SVG
  partSet.forEach(p => {
    const info = PARTS.find(x => x.id === p);
    if (!info) return;
    const svgEl = document.getElementById(info.svgId);
    if (!svgEl) return;
    svgEl.classList.add('highlighted');
    // Color the paths
    const color = PART_COLORS[p] || '#4db8ff';
    svgEl.querySelectorAll('path, ellipse, rect, circle, line').forEach(el => {
      const fill = el.getAttribute('fill');
      if (fill && fill !== 'none' && !fill.startsWith('url')) {
        el.style.fill = color.replace(')', ',0.3)').replace('rgb', 'rgba').replace('#', '').length > 6
          ? color : hexToRgba(color, 0.3);
        el.style.stroke = color;
        el.style.strokeOpacity = '0.9';
      } else if (fill && fill.startsWith('url')) {
        el.style.stroke = color;
        el.style.strokeOpacity = '0.8';
        el.style.strokeWidth = '2';
      }
      if (el.getAttribute('stroke') !== 'none') {
        el.style.stroke = color;
        el.style.strokeOpacity = '0.9';
      }
    });
  });

  // Group items by part for bubble display
  const byPart = {};
  data.items.forEach(item => {
    if (!byPart[item.part]) byPart[item.part] = [];
    byPart[item.part].push(item);
  });

  // Create bubbles
  const stage = document.getElementById('car-stage');
  const container = document.getElementById('bubble-container');
  const svgWrap = document.getElementById('car-svg-wrap');

  // Calculate bubble positions after layout
  requestAnimationFrame(() => {
    const stageRect = stage.getBoundingClientRect();
    const svgRect = svgWrap.getBoundingClientRect();
    const svgLeft = svgRect.left - stageRect.left;
    const svgTop = svgRect.top - stageRect.top;
    const svgW = svgRect.width;
    const svgH = svgRect.height;

    // Track used horizontal positions for spread
    let placedBubbles = 0;

    Object.keys(byPart).forEach((partId, idx) => {
      const partInfo = PARTS.find(x => x.id === partId);
      if (!partInfo) return;

      const items = byPart[partId];
      const firstItem = items[0];

      // Position: use SVG percentage coordinates
      const pxX = svgLeft + (partInfo.bubbleX / 100) * svgW;
      const pxY = svgTop + (partInfo.bubbleY / 100) * svgH;

      // Convert to % of stage
      const leftPct = (pxX / stageRect.width) * 100;
      const topPct = (pxY / stageRect.height) * 100;

      const bubble = document.createElement('div');
      bubble.className = 'repair-bubble';
      bubble.style.left = `${leftPct}%`;
      bubble.style.top = `${topPct}%`;

      const photo = firstItem.photos && firstItem.photos.length > 0
        ? `<img class="bubble-thumb" src="${firstItem.photos[0]}" alt="">`
        : `<div class="bubble-thumb-placeholder">📷 사진 없음</div>`;

      const moreCount = items.length > 1 ? `<div class="bubble-tap">+ ${items.length-1}개 항목 더</div>` : '';

      bubble.innerHTML = `
        <div class="bubble-card">
          <div class="bubble-part-name">${partInfo.label}</div>
          <div class="bubble-item-name">${firstItem.name}</div>
          ${photo}
          <div class="bubble-tap">클릭하여 상세 보기 →</div>
          ${moreCount}
        </div>
        <div class="bubble-line"></div>
        <div class="bubble-dot"></div>
      `;

      bubble.addEventListener('click', () => openModal(items, partInfo));
      container.appendChild(bubble);
      placedBubbles++;
    });
  });
}

function hexToRgba(hex, alpha) {
  const r = parseInt(hex.slice(1,3), 16);
  const g = parseInt(hex.slice(3,5), 16);
  const b = parseInt(hex.slice(5,7), 16);
  return `rgba(${r},${g},${b},${alpha})`;
}

// ══════════════════════════════════════
//  MODAL
// ══════════════════════════════════════
let modalItems = [];
let modalPartInfo = null;
let currentModalIdx = 0;

function openModal(items, partInfo) {
  modalItems = items;
  modalPartInfo = partInfo;
  currentModalIdx = 0;
  renderModal();
  document.getElementById('modal-overlay').classList.add('open');
}

function renderModal() {
  const item = modalItems[currentModalIdx];
  document.getElementById('modal-part').textContent = modalPartInfo.label;
  document.getElementById('modal-title').textContent = item.name;
  document.getElementById('modal-type').textContent = item.type ? `정비 유형: ${item.type}` : '';

  const photosEl = document.getElementById('modal-photos');
  photosEl.innerHTML = '';
  if (item.photos && item.photos.length > 0) {
    item.photos.forEach(src => {
      const img = document.createElement('img');
      img.className = 'modal-photo';
      img.src = src;
      photosEl.appendChild(img);
    });
  }

  document.getElementById('modal-desc').textContent = item.desc || '정비 내용이 입력되지 않았습니다.';

  const commentSection = document.getElementById('modal-comment-section');
  const commentEl = document.getElementById('modal-comment');
  if (item.comment) {
    commentEl.textContent = item.comment;
    commentSection.style.display = '';
  } else {
    commentSection.style.display = 'none';
  }

  // Multi-item navigation
  if (modalItems.length > 1) {
    let nav = document.getElementById('modal-nav');
    if (!nav) {
      nav = document.createElement('div');
      nav.id = 'modal-nav';
      nav.style.cssText = 'display:flex;gap:10px;margin-top:16px;justify-content:center;';
      document.getElementById('modal').appendChild(nav);
    }
    nav.innerHTML = modalItems.map((it, i) =>
      `<button onclick="switchModal(${i})" style="
        padding:7px 16px; border-radius:8px; border:1px solid ${i===currentModalIdx?'var(--accent)':'var(--border)'};
        background:${i===currentModalIdx?'rgba(77,184,255,0.15)':'transparent'};
        color:${i===currentModalIdx?'var(--accent)':'var(--text-dim)'};
        font-family:Pretendard,sans-serif; font-size:13px; cursor:pointer;
      ">${i+1}. ${it.name}</button>`
    ).join('');
  }
}

function switchModal(idx) {
  currentModalIdx = idx;
  renderModal();
}

function closeModal(e) {
  if (e.target === document.getElementById('modal-overlay')) {
    document.getElementById('modal-overlay').classList.remove('open');
  }
}

function closeModalDirect() {
  document.getElementById('modal-overlay').classList.remove('open');
}

// ══════════════════════════════════════
//  ROUTER
// ══════════════════════════════════════
window.addEventListener('DOMContentLoaded', () => {
  const params = new URLSearchParams(location.search);
  const viewParam = params.get('view');

  if (viewParam) {
    // Customer view
    document.getElementById('customer-page').style.display = 'block';
    try {
      const data = JSON.parse(decodeURIComponent(atob(viewParam)));
      loadCustomerView(data);
    } catch(e) {
      document.getElementById('car-stage').innerHTML =
        '<div class="empty-state"><div class="empty-icon">⚠️</div><div>정비 데이터를 불러올 수 없습니다.</div></div>';
    }
  } else {
    // Admin view
    document.getElementById('admin-page').style.display = 'block';
    // Set today's date
    document.getElementById('repair-date').valueAsDate = new Date();
    // Add first item by default
    addItem();
  }
});
</script>
